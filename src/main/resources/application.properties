spring.application.name=AutoBook

# Persistent PostgreSQL database. Connection settings come from environment variables
# (see .env.example); the defaults below only fit a local PostgreSQL on the standard port.
spring.datasource.url=${AUTOBOOK_DB_URL:jdbc:postgresql://localhost:5432/autobook}
spring.datasource.username=${AUTOBOOK_DB_USER:autobook}
spring.datasource.password=${AUTOBOOK_DB_PASSWORD:}

# A booking waits at most 10 seconds for another transaction's row lock on the same slot,
# then fails with 409 (same limit as the Milestone 2 H2 LOCK_TIMEOUT).
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '10s'

# Flyway owns the schema: db/migration/V*.sql run once each, in order, and are recorded in
# flyway_schema_history. Existing tables and bookings are never dropped on restart.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Observability. Actuator endpoints are served from the root path: GET /health, /info, /metrics.
# /health is public and lists each component's status (including the database, "db"); full
# details and /metrics are for admins only (see SecurityConfig).
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-components=always
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=AutoBook
info.app.description=Automotive service appointment booking (CMPE 172)

# Logging: INFO for AutoBook's own events, WARN for recoverable problems, ERROR for failures that
# need attention. Request bodies, passwords, and session ids are never logged.
logging.level.com.autobook=INFO

# Calls to the external notification service. A blank base URL means the mock service inside
# this application.
autobook.notifications.base-url=${AUTOBOOK_NOTIFICATIONS_URL:}
autobook.notifications.timeout=2s
autobook.notifications.max-attempts=3
autobook.notifications.initial-backoff=200ms
autobook.notifications.backoff-multiplier=2.0
autobook.notifications.max-backoff=2s
autobook.notifications.redelivery-delay=30s
autobook.notifications.max-delivery-rounds=5
autobook.notifications.retry-interval-ms=15000

# ---------------------------------------------------------------------------------------------
# Milestone 4: Spring AI with the Gemini Developer API (Google AI Studio). Vertex AI is NOT used:
# no project-id, location, or service-account credentials are configured.
#
# AI is OFF unless AUTOBOOK_AI_PROVIDER=google-genai. Docker Compose sets it automatically when
# GEMINI_API_KEY is present (see docker-compose.yml). Without a key, booking, cancellation, and
# notifications work exactly as before and the AI endpoints answer 503 "AI assistant unavailable".
# ---------------------------------------------------------------------------------------------
spring.ai.model.chat=${AUTOBOOK_AI_PROVIDER:none}
spring.ai.model.embedding.text=${AUTOBOOK_AI_PROVIDER:none}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
# Spring AI's defaults (gemini-2.5-flash, text-embedding-004) have been shut down by Google.
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash}
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
# AutoBook builds its own ChatClient from the ChatModel when one exists, so the prototype
# ChatClient.Builder bean (which requires a ChatModel) is not needed.
spring.ai.chat.client.enabled=false

# Limits for the AI features (see com.autobook.ai.AiProperties)
autobook.ai.max-message-length=1000
autobook.ai.max-tool-calls-per-message=8
autobook.ai.conversation-turns=10
autobook.ai.conversation-ttl=30m
autobook.ai.pending-action-ttl=5m
autobook.ai.faq.top-k=4
autobook.ai.faq.similarity-threshold=0.6
autobook.ai.faq.knowledge-source=classpath:knowledge/autobook-faq.md
