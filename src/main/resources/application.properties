spring.application.name=AutoBook

# Persistent PostgreSQL database. Connection settings come from environment variables
# (see .env.example); the defaults below only fit a local PostgreSQL on the standard port.
spring.datasource.url=${AUTOBOOK_DB_URL:jdbc:postgresql://localhost:5432/autobook}
spring.datasource.username=${AUTOBOOK_DB_USER:autobook}
spring.datasource.password=${AUTOBOOK_DB_PASSWORD:}

# A booking waits at most 10 seconds for another transaction's row lock on the same slot,
# then fails with 409 (same limit as the Milestone 2 H2 LOCK_TIMEOUT).
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '10s'

# Flyway owns the schema: db/migration/V*.sql run once each, in order, and are recorded in
# flyway_schema_history. Existing tables and bookings are never dropped on restart.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Observability. Actuator endpoints are served from the root path: GET /health, /info, /metrics.
# /health is public and lists each component's status (including the database, "db"); full
# details and /metrics are for admins only (see SecurityConfig).
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-components=always
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=AutoBook
info.app.description=Automotive service appointment booking (CMPE 172)

# Logging: INFO for AutoBook's own events, WARN for recoverable problems, ERROR for failures that
# need attention. Request bodies, passwords, and session ids are never logged.
logging.level.com.autobook=INFO

# Calls to the external notification service. A blank base URL means the mock service inside
# this application.
autobook.notifications.base-url=${AUTOBOOK_NOTIFICATIONS_URL:}
autobook.notifications.timeout=2s
autobook.notifications.max-attempts=3
autobook.notifications.initial-backoff=200ms
autobook.notifications.backoff-multiplier=2.0
autobook.notifications.max-backoff=2s
autobook.notifications.redelivery-delay=30s
autobook.notifications.max-delivery-rounds=5
autobook.notifications.retry-interval-ms=15000
