# Test database: a throwaway PostgreSQL 16 container started by Testcontainers (requires Docker).
# Flyway builds the same schema and seed data as production on it. Tests that commit data use
# their own database URL so they cannot change the seed data that other test classes rely on.
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///autobook
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test
