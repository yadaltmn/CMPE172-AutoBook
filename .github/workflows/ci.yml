name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          ./mvnw -B -version
          docker version --format 'Docker server {{.Server.Version}}'

      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker-compose:
    name: Docker image and Compose smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create a CI-only .env file
        run: |
          cp .env.example .env
          sed -i "s/^AUTOBOOK_DB_PASSWORD=.*/AUTOBOOK_DB_PASSWORD=ci-$(openssl rand -hex 12)/" .env

      - name: Build the image and start AutoBook with PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Book, restart, and verify the booking persists
        run: ./scripts/compose-smoke-test.sh

      - name: Show container logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop containers and remove the CI volume
        if: always()
        run: docker compose down -v
